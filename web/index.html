<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip's Room</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6efe6; --panel:#fffaf3; --ink:#3b2f2a; --muted:#8a7a70; --accent:#e9855b; --line:#eadccd; --chip:#f4e4d3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#221c19; --panel:#2d2521; --ink:#f3e7dc; --muted:#b3a295; --accent:#f0976f; --line:#43372f; --chip:#3d312a; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display:grid; grid-template-columns:1fr 340px; height:100%; }
  #stage { position:relative; min-height:0; overflow:hidden; }
  #stage canvas { display:block; width:100%; height:100%; }
  #hint { position:absolute; left:16px; bottom:16px; right:16px; color:var(--muted); font-size:14px; pointer-events:none; }
  #panel { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:20px 16px; display:flex; flex-direction:column; gap:18px; }
  h1 { margin:0; font-size:22px; }
  h2 { margin:0 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; }
  .mood { background:var(--chip); border-radius:999px; padding:2px 12px; font-size:14px; }
  .bar { display:grid; grid-template-columns:84px 1fr; align-items:center; gap:8px; font-size:14px; margin:4px 0; }
  .track { height:8px; background:var(--chip); border-radius:99px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); border-radius:99px; transition:width .6s; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--chip); border-radius:999px; padding:2px 10px; font-size:14px; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { font-size:14px; }
  .muted { color:var(--muted); }
  .note { font-size:14px; color:var(--muted); }
  .buttons { display:flex; gap:8px; flex-wrap:wrap; }
  button {
    font:inherit; font-size:15px; padding:9px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--chip); color:var(--ink); cursor:pointer;
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#c0452f; font-size:14px; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; grid-template-rows:58% 42%; }
    #panel { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="hint"></div>
  </div>
  <aside id="panel">
    <div>
      <div class="row"><h1>Pip</h1><span class="mood" id="mood">…</span></div>
    </div>
    <div class="buttons">
      <button class="primary" id="wake">Wake Pip now</button>
      <button id="sound">🔇 Sound off</button>
    </div>
    <div class="err" id="err"></div>
    <div>
      <h2>How Pip feels</h2>
      <div id="bars"></div>
    </div>
    <div><h2>Interests</h2><div class="chips" id="interests"></div></div>
    <div><h2>Pip asks for</h2><ul id="requests"></ul></div>
    <div><h2>Recently</h2><ul id="recent"></ul></div>
    <div><h2>Last thing learned</h2><div class="note" id="learned"></div></div>
  </aside>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
