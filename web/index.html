<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip's Room</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6efe6; --panel:#fffaf3; --ink:#3b2f2a; --muted:#8a7a70; --accent:#e9855b; --line:#eadccd; --chip:#f4e4d3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#221c19; --panel:#2d2521; --ink:#f3e7dc; --muted:#b3a295; --accent:#f0976f; --line:#43372f; --chip:#3d312a; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display:grid; grid-template-columns:1fr 420px; height:100%; }
  #stage { position:relative; min-height:0; overflow:hidden; }
  #stage canvas { display:block; width:100%; height:100%; }
  #hint { position:absolute; left:16px; bottom:12px; right:16px; color:var(--muted); font-size:13px; pointer-events:none; }
  #panel { background:var(--panel); border-left:1px solid var(--line); min-height:0; display:flex; flex-direction:column; }
  .head { padding:16px 16px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1 { margin:0; font-size:22px; }
  .mood { background:var(--chip); border-radius:999px; padding:2px 12px; font-size:14px; }
  .spacer { flex:1; }
  .small { font-size:13px; padding:5px 10px; border-radius:10px; }
  .err { color:#c0452f; font-size:14px; padding:6px 16px 0; }
  #tabs { display:flex; gap:2px; padding:12px 8px 0; border-bottom:1px solid var(--line); }
  .tab { position:relative; background:none; border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 12px; color:var(--muted); font-size:15px; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .count { margin-left:6px; background:var(--accent); color:#fff; border-radius:999px; font-size:12px; padding:0 7px; }
  .count:empty { display:none; }
  .asklist { gap:14px; }
  .asklist li { display:list-item; list-style:disc; margin-left:20px; padding-left:4px; }
  .asklist .what { font-weight:600; }
  .asklist .why { color:var(--muted); font-size:14px; }
  .asklist .buttons { display:flex; gap:8px; margin-top:6px; }
  .donelist li { color:var(--muted); font-size:14px; text-decoration:line-through; }
  .dot { display:none; position:absolute; top:6px; right:4px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .dot.on { display:block; }
  .pane { flex:1; overflow:auto; padding:16px; }
  .pane[hidden] { display:none; }
  h2 { margin:18px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  h2:first-child { margin-top:0; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .item { padding-bottom:10px; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .meta { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:2px; }
  .item p { margin:0; white-space:pre-wrap; }
  .mine { border-left:3px solid var(--line); padding-left:10px; }
  #reply { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  #reply .row { display:flex; align-items:center; gap:10px; }
  textarea, input[type=password] { font:inherit; font-size:15px; width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical; }
  .ask { border-left:3px solid var(--accent); padding-left:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--chip); border-radius:999px; padding:2px 10px; font-size:14px; }
  .muted { color:var(--muted); }
  .story { margin:0; }
  .bar { display:grid; grid-template-columns:84px 1fr; align-items:center; gap:8px; font-size:14px; margin:4px 0; }
  .track { height:8px; background:var(--chip); border-radius:99px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); border-radius:99px; transition:width .6s; }
  button { font:inherit; font-size:15px; padding:9px 14px; border-radius:12px; border:1px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  @media (max-width:820px) {
    #app { grid-template-columns:1fr; grid-template-rows:34% 66%; }
    #panel { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="hint"></div>
  </div>
  <aside id="panel">
    <div class="head">
      <h1>Pip</h1><span class="mood" id="mood">…</span>
      <span class="spacer"></span>
      <button class="small primary" id="wake">Wake Pip now</button>
      <button class="small" id="sound">🔇 Sound off</button>
    </div>
    <div class="err" id="err"></div>
    <nav id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="thoughts">Thoughts</button>
      <button class="tab" role="tab" data-tab="asks">Asks<span class="count" id="askcount"></span></button>
      <button class="tab" role="tab" data-tab="wants">Wants</button>
      <button class="tab" role="tab" data-tab="messages">Messages<span class="dot" id="msgdot"></span></button>
      <button class="tab" role="tab" data-tab="life">Life</button>
    </nav>

    <section class="pane" data-pane="thoughts"><ul id="thoughts"></ul></section>

    <section class="pane" data-pane="asks" hidden>
      <h2>Pip would like from you</h2>
      <ul class="asklist" id="asks"></ul>
      <h2>Done</h2>
      <ul class="donelist" id="asksdone"></ul>
    </section>

    <section class="pane" data-pane="wants" hidden>
      <h2>Pip wants</h2><ul id="wants"></ul>
      <h2>Pip wonders</h2><ul id="questions"></ul>
      <h2>Came true</h2><ul id="fulfilled"></ul>
      <h2>Interests</h2><div class="chips" id="interests"></div>
    </section>

    <section class="pane" data-pane="messages" hidden>
      <form id="reply">
        <textarea id="replytext" rows="3" maxlength="1000" placeholder="Write to Pip…"></textarea>
        <input id="replykey" type="password" autocomplete="off" placeholder="Your reply key (only needed once)" hidden>
        <div class="row"><button type="submit" class="primary" id="send">Send</button><span class="muted" id="replystatus"></span></div>
      </form>
      <ul id="messages"></ul>
    </section>

    <section class="pane" data-pane="life" hidden>
      <h2>Pip's story so far</h2><p class="story" id="story"></p>
      <h2>How Pip feels</h2><div id="bars"></div>
      <h2>Recently</h2><ul id="recent"></ul>
      <h2>Last thing learned</h2><div class="muted" id="learned"></div>
    </section>
  </aside>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
