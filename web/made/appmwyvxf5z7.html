<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Jumping Frog</title><style>body { margin: 0; padding: 12px; background: #182618; color: #d0e8d0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; } h1 { margin: 0 0 4px 0; font-size: 1.1rem; text-align: center; } p { margin: 0 0 10px 0; font-size: 0.75rem; opacity: 0.8; text-align: center; } canvas { background: #244466; border: 3px solid #0e170e; border-radius: 6px; max-width: 100%; touch-action: none; }</style></head><body><h1>Jumping Frog (v1)</h1><p>Space, Up Arrow, or Tap to jump</p><canvas id="game" width="360" height="480"></canvas><script>(function() { const canvas = document.getElementById('game'); const ctx = canvas.getContext('2d'); let state = 'START'; let score = 0; let best = 0; const frog = { x: 180, y: 400, r: 12, vy: 0, jumping: false, pad: null }; let pads = []; function reset() { score = 0; frog.x = 180; frog.y = 410; frog.vy = 0; frog.jumping = false; frog.pad = null; pads = [{ x: 130, y: 430, w: 100, h: 14, vx: 0 }]; for (let i = 1; i < 5; i++) { addPad(430 - i * 90); } state = 'PLAY'; } function addPad(y) { const w = 65 + Math.random() * 35; const x = Math.random() * (canvas.width - w); const vx = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 1.4); pads.push({ x: x, y: y, w: w, h: 14, vx: vx }); } function doJump() { if (state === 'START' || state === 'GAMEOVER') { reset(); return; } if (!frog.jumping) { frog.vy = -10; frog.jumping = true; frog.pad = null; } } window.addEventListener('keydown', function(e) { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); } }); canvas.addEventListener('pointerdown', function(e) { e.preventDefault(); doJump(); }); function update() { if (state !== 'PLAY') return; for (let i = 0; i < pads.length; i++) { let p = pads[i]; p.x += p.vx; if (p.x <= 0 || p.x + p.w >= canvas.width) { p.vx *= -1; } } if (frog.pad) { frog.x += frog.pad.vx; frog.y = frog.pad.y - frog.r; if (frog.x < frog.pad.x - 2 || frog.x > frog.pad.x + frog.pad.w + 2) { frog.pad = null; frog.jumping = true; } } else { frog.vy += 0.45; frog.y += frog.vy; if (frog.vy > 0) { for (let i = 0; i < pads.length; i++) { let p = pads[i]; if (frog.x >= p.x - 4 && frog.x <= p.x + p.w + 4 && frog.y + frog.r >= p.y && frog.y + frog.r <= p.y + p.h + 6) { frog.jumping = false; frog.vy = 0; frog.pad = p; if (p.y < 250) { let diff = 250 - p.y; for (let j = 0; j < pads.length; j++) { pads[j].y += diff; } frog.y += diff; score += 10; if (score > best) best = score; pads = pads.filter(pd => pd.y < canvas.height + 20); while (pads.length < 5) { let minY = Math.min(...pads.map(pd => pd.y)); addPad(minY - 90); } } break; } } } } if (frog.y - frog.r > canvas.height) { state = 'GAMEOVER'; } if (frog.x < frog.r) frog.x = frog.r; if (frog.x > canvas.width - frog.r) frog.x = canvas.width - frog.r; } function draw() { ctx.fillStyle = '#244466'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fillRect(30, 100, 80, 2); ctx.fillRect(220, 240, 60, 2); if (state === 'START') { ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center'; ctx.fillText('JUMPING FROG', canvas.width / 2, 200); ctx.font = '13px monospace'; ctx.fillStyle = '#a0caa0'; ctx.fillText('Tap or Space to start', canvas.width / 2, 240); return; } for (let i = 0; i < pads.length; i++) { let p = pads[i]; ctx.fillStyle = '#2e6b37'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#1e4724'; ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3); } ctx.fillStyle = '#4ca644'; ctx.beginPath(); ctx.arc(frog.x, frog.y, frog.r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(frog.x - 5, frog.y - 8, 3, 0, Math.PI * 2); ctx.arc(frog.x + 5, frog.y - 8, 3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(frog.x - 5, frog.y - 8, 1.5, 0, Math.PI * 2); ctx.arc(frog.x + 5, frog.y - 8, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left'; ctx.fillText('Score: ' + score, 12, 24); if (state === 'GAMEOVER') { ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.fillText('SPLASH', canvas.width / 2, 180); ctx.fillStyle = '#ffffff'; ctx.font = '13px monospace'; ctx.fillText('Score: ' + score, canvas.width / 2, 220); ctx.fillText('Best: ' + best, canvas.width / 2, 240); ctx.fillStyle = '#a0caa0'; ctx.fillText('Tap or Space to try again', canvas.width / 2, 290); } } function loop() { update(); draw(); requestAnimationFrame(loop); } loop(); })();</script></body></html>
