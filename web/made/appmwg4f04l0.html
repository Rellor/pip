<!doctype html><html><head><meta charset='utf-8'><title>Comet 1680</title><style>body{margin:0;background:#060814;color:#e0e8f8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}canvas{background:#02030a;border:1px solid #1a2540;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,0.8)}#ui{margin-top:12px;display:flex;gap:10px;align-items:center}button{background:#1e2942;color:#e0e8f8;border:1px solid #3b4e76;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}button:hover{background:#2a3a5d}p{margin:6px 0 0 0;font-size:12px;color:#7e92b8}</style></head><body><canvas id='c' width='440' height='320'></canvas><div id='ui'><button id='launch'>Launch Comet</button><button id='reset'>Reset Orbit</button></div><p>Simulating the parabolic flyby of the Great Comet of 1680</p><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let t=-3.5,running=true;const stars=Array.from({length:40},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2,a:Math.random()}));const trail=[];function draw(){ctx.fillStyle='#04060f';ctx.fillRect(0,0,c.width,c.height);stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${0.3+0.5*Math.sin(t*2+s.a*10)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});const sunX=220,sunY=160;const grad=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,28);grad.addColorStop(0,'#fff8cc');grad.addColorStop(0.3,'#ffaa33');grad.addColorStop(1,'transparent');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(sunX,sunY,28,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffea77';ctx.beginPath();ctx.arc(sunX,sunY,8,0,Math.PI*2);ctx.fill();const cx=sunX+t*65;const cy=sunY-38+0.25*t*t*45;if(running){trail.push({x:cx,y:cy,alpha:1});if(trail.length>45)trail.shift();t+=0.035;if(t>4)t=-4;}trail.forEach((p,i)=>{p.alpha*=0.96;ctx.fillStyle=`rgba(150,210,255,${(i/trail.length)*0.6})`;ctx.beginPath();ctx.arc(p.x,p.y,1.5+i*0.1,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx,cy,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(200,230,255,0.4)';ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();requestAnimationFrame(draw);}draw();document.getElementById('launch').onclick=()=>{running=true;t=-3.5;trail.length=0;};document.getElementById('reset').onclick=()=>{t=-3.5;trail.length=0;};</script></body></html>
