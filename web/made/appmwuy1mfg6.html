<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Sky Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070913;
      color: #c4c9e2;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #e0e4f7;
      letter-spacing: 1px;
    }
    canvas {
      background: #03040a;
      border: 1px solid #1f2544;
      border-radius: 6px;
      max-width: 100%;
      touch-action: none;
    }
    .panel {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.75rem;
    }
    .info {
      display: flex;
      justify-content: space-between;
      color: #8a93b8;
    }
    .help {
      background: #0d1126;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #1a203d;
      line-height: 1.4;
    }
    button {
      background: #161c38;
      color: #c4c9e2;
      border: 1px solid #2d3666;
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:active {
      background: #2d3666;
    }
  </style>
</head>
<body>
  <h1>NIGHT SKY SIMULATOR</h1>
  <canvas id="sky" width="400" height="400"></canvas>
  <div class="panel">
    <div class="info">
      <span id="starCount">Stars: 0</span>
      <span id="lineCount">Lines: 0</span>
      <span id="stateText">Spinning</span>
    </div>
    <div class="help">
      Tap canvas: add star | Space: toggle spin<br>Up/Down arrows: change speed | Left/Right: rotate
    </div>
    <button id="resetBtn">Reset Constellations</button>
  </div>
  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const starCount = document.getElementById('starCount');
    const lineCount = document.getElementById('lineCount');
    const stateText = document.getElementById('stateText');
    const resetBtn = document.getElementById('resetBtn');

    let stars = [];
    let lines = [];
    let angle = 0;
    let speed = 0.0015;
    let isSpinning = true;
    let moonX = 80;
    let moonY = 80;

    function makeStars() {
      stars = [];
      lines = [];
      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.8 + 0.8,
          alpha: Math.random(),
          dir: Math.random() > 0.5 ? 0.01 : -0.01
        });
      }
      rebuildConstellations();
      updateText();
    }

    function rebuildConstellations() {
      lines = [];
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          let dx = stars[i].x - stars[j].x;
          let dy = stars[i].y - stars[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 55) {
            lines.push({ a: stars[i], b: stars[j] });
          }
        }
      }
    }

    function updateText() {
      starCount.textContent = 'Stars: ' + stars.length;
      lineCount.textContent = 'Lines: ' + lines.length;
      stateText.textContent = isSpinning ? 'Spinning' : 'Still';
    }

    function addStar(x, y) {
      stars.push({
        x: x,
        y: y,
        r: Math.random() * 2 + 1.2,
        alpha: 1,
        dir: -0.015
      });
      rebuildConstellations();
      updateText();
    }

    function draw() {
      ctx.fillStyle = '#03040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let grad = ctx.createRadialGradient(200, 200, 20, 200, 200, 260);
      grad.addColorStop(0, '#0c122b');
      grad.addColorStop(1, '#03040a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      if (isSpinning) {
        angle += speed;
      }
      ctx.rotate(angle);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      ctx.fillStyle = '#eae5c9';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#060917';
      ctx.beginPath();
      ctx.arc(moonX + 6, moonY - 3, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(100, 140, 240, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < lines.length; i++) {
        ctx.beginPath();
        ctx.moveTo(lines[i].a.x, lines[i].a.y);
        ctx.lineTo(lines[i].b.x, lines[i].b.y);
        ctx.stroke();
      }

      for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        s.alpha += s.dir;
        if (s.alpha >= 1 || s.alpha <= 0.15) {
          s.dir = -s.dir;
        }

        ctx.fillStyle = 'rgba(240, 243, 255, ' + Math.max(0.1, s.alpha) + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
      requestAnimationFrame(draw);
    }

    function handlePointer(e) {
      let rect = canvas.getBoundingClientRect();
      let clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX === undefined || clientY === undefined) return;
      let scaleX = canvas.width / rect.width;
      let scaleY = canvas.height / rect.height;
      let x = (clientX - rect.left) * scaleX;
      let y = (clientY - rect.top) * scaleY;
      addStar(x, y);
    }

    canvas.addEventListener('click', handlePointer);
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });

    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        isSpinning = !isSpinning;
        updateText();
      } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        speed += 0.001;
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        speed = Math.max(0, speed - 0.001);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        angle -= 0.08;
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        angle += 0.08;
      }
    });

    resetBtn.addEventListener('click', makeStars);

    makeStars();
    draw();
  </script>
</body>
</html>
