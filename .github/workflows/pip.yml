name: Pip

on:
  schedule:
    - cron: '23 * * * *'   # safety net: starts a new loop if the chain ever breaks
  workflow_dispatch:       # start by hand, or from the reply service when Bas writes

permissions:
  contents: write
  actions: write

# Only one loop at a time. A newer request waits its turn instead of running alongside.
concurrency:
  group: pip
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Git identity
        run: |
          git config user.name "pip-bot"
          git config user.email "pip-bot@users.noreply.github.com"

      # Pip's camera is a hidden browser that draws his room. If this step fails, Pip just cannot take photos.
      - name: Camera
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
        continue-on-error: true

      # Pip lives here: he wakes every 8 minutes for about 5.5 hours, and straight away when Bas writes.
      - name: Pip lives
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PIP_SITE_URL: ${{ vars.PIP_SITE_URL }}
        run: node loop.js

      # Only after a clean finish, so a broken loop can never restart itself in a tight circle.
      - name: Start the next loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pip.yml --ref main
