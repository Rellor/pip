name: Pip

on:
  schedule:
    - cron: '*/12 * * * *'   # checked every 12 minutes; Pip decides himself if he is asleep (23:00-08:00 Amsterdam)
  workflow_dispatch:         # lets you wake him by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: pip
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wake Pip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node pip.js

      # Vercel redeploys the site on every push, so Pip's new state goes live by itself.
      - name: Save Pip's memory
        run: |
          git config user.name "pip-bot"
          git config user.email "pip-bot@users.noreply.github.com"
          git add web/state.json diary.md
          git diff --cached --quiet || (git commit -m "Pip woke up" && git push)
